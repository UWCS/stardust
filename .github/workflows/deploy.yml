
name: Build and deploy Stardust

on:
  push:
    branches: [container]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: stardust-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get Zola
        run: |
          bash ./install-linux.sh
          test -x ./bin/zola

      - name: Setup Node
        uses: actions/setup-node@v7

      - name: Install PurgeCSS per package-lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build site
        run: sh ./build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: LC repo name
        run: echo "REPO_LC=${REPO,,}" >>${GITHUB_ENV}
        env:
          REPO: '${{ github.repository }}'

      - name: Build and push Docker img
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:container
