server {
    listen 80;
    server_name uwcs.co.uk;

    root /srv/stardust/prod/public;

    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(uwcs\.ical|fonts/|icon-packs/) {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 81;
    server_name draft.uwcs.co.uk;

    root /srv/stardust/draft/public;

    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(uwcs\.ical|fonts/|icon-packs/) {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }
}