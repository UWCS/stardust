server {
    listen 80;
    server_name stardusty;

    root /srv/stardust/public;

    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(uwcs\.ical|fonts/|icon-packs/) {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }
}