services:
  stardusty:
    container_name: stardusty
    image: ghcr.io/uwcs/stardust:container
    restart: unless-stopped
    ports:
      - "36904:80"
    environment:
      - VIRTUAL_HOST=stardusty
      - VIRTUAL_PORT=80

  stardusty-watchtower:
    container_name: stardusty-watchtower
    image: index.docker.io/nickfedor/watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
