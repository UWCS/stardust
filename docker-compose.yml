services:
  stardust:
    container_name: stardust
    image: ghcr.io/uwcs/stardust:master
    restart: unless-stopped
    ports:
      - "36904:80"  # prod
      - "36905:81"  # draft

    # use if deploying behind e.g. nginx pm
    environment:
      - VIRTUAL_HOST=stardusty
      - VIRTUAL_PORT=80
